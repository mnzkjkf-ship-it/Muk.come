<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลอยกระทงออนไลน์ - Loy Krathong 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050b1a; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* UI Overlay */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .pointer-events-auto { pointer-events: auto; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .top-badge { background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; backdrop-filter: blur(5px); font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .online-dot { width: 10px; height: 10px; background: #2ecc71; border-radius: 50%; box-shadow: 0 0 8px #2ecc71; }

        /* Right TikTok Style Sidebar */
        .sidebar { position: absolute; right: 15px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: auto; z-index: 10; }
        .side-btn { background: rgba(0,0,0,0.5); border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); transition: transform 0.2s; }
        .side-btn:active { transform: scale(0.9); }
        .side-btn span { font-size: 11px; margin-top: 2px; }

        /* Bottom Controls */
        .bottom-bar { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; max-width: 400px; margin: 0 auto; width: 100%; padding-bottom: 20px; }
        .action-btn { background: linear-gradient(135deg, #ff758c, #ff7eb3); border: none; color: white; padding: 14px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,117,140,0.4); text-align: center; transition: 0.2s; }
        .action-btn:active { transform: scale(0.98); }

        /* Modals & Dialogs */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; padding: 20px; }
        .modal-content { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 360px; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-title { font-size: 18px; font-weight: bold; text-align: center; color: #ffd700; }
        
        .char-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .char-card { background: rgba(255,255,255,0.05); border: 2px solid transparent; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .char-card.active { border-color: #ff758c; background: rgba(255,117,140,0.1); }
        
        input, textarea { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px; color: white; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #ff758c; }
    </style>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="header">
            <div class="top-badge pointer-events-auto" onclick="openCharModal()">
                👤 <span id="current-char-name">สาวน้อย</span> ▾
            </div>
            <div class="top-badge">
                <div class="online-dot"></div>
                <span id="online-count">กำลังออนไลน์ 1 คน</span>
            </div>
        </div>

        <div class="sidebar">
            <button class="side-btn" onclick="likeEffect()">❤️<span id="like-count">22.9K</span></button>
            <button class="side-btn" onclick="openWishModal()">💬<span>อธิษฐาน</span></button>
            <button class="side-btn" onclick="shareWeb()">🔗<span>แชร์</span></button>
        </div>

        <div class="bottom-bar">
            <div style="background: rgba(0,0,0,0.4); padding: 8px 14px; border-radius: 20px; font-size: 13px; backdrop-filter: blur(5px); text-align: center;">
                🎵 เพลง: ลอยกระทง (Keng Harit)
            </div>
            <button class="action-btn pointer-events-auto" onclick="launchKrathong()">🌕 ลอยกระทงเลย!</button>
        </div>
    </div>

    <!-- Modal เลือกตัวละคร -->
    <div id="char-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">เลือกตัวละครของคุณ</div>
            <div class="char-grid">
                <div class="char-card active" onclick="selectChar('สาวน้อย', 0)">👧<div style="margin-top:6px;font-size:13px;">สาวน้อย</div></div>
                <div class="char-card" onclick="selectChar('หนุ่มน้อย', 1)">👦<div style="margin-top:6px;font-size:13px;">หนุ่มน้อย</div></div>
                <div class="char-card" onclick="selectChar('แมวส้ม', 2)">🐱<div style="margin-top:6px;font-size:13px;">แมวส้ม</div></div>
                <div class="char-card" onclick="selectChar('กระต่าย', 3)">🐰<div style="margin-top:6px;font-size:13px;">กระต่าย</div></div>
            </div>
            <input type="text" id="nickname-input" placeholder="พิมพ์ชื่อเล่นของคุณ..." value="เธอ" maxlength="15">
            <button class="action-btn" onclick="closeCharModal()" style="padding:10px; font-size:14px;">ตกลง</button>
        </div>
    </div>

    <!-- Modal คำอธิษฐาน -->
    <div id="wish-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">คำอธิษฐานในกระทง</div>
            <textarea id="wish-input" rows="4" placeholder="เขียนคำอธิษฐานขอพรวันลอยกระทง..."></textarea>
            <button class="action-btn" onclick="closeWishModal()" style="padding:10px; font-size:14px;">บันทึกคำอธิษฐาน</button>
        </div>
    </div>

    <script>
        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 10);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x334466, 1.5);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x99bbff, 1.2);
        moonLight.position.set(5, 10, 5);
        scene.add(moonLight);

        // Water Surface
        const waterGeometry = new THREE.PlaneGeometry(100, 100, 32, 32);
        const waterMaterial = new THREE.MeshStandardMaterial({
            color: 0x0a192f,
            roughness: 0.1,
            metalness: 0.8,
            flatShading: true
        });
        const water = new THREE.Mesh(waterGeometry, waterMaterial);
        water.rotation.x = -Math.PI / 2;
        water.position.y = 0;
        scene.add(water);

        // Moon & Sky Background Elements
